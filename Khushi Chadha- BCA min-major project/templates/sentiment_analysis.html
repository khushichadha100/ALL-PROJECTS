<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <link rel="icon" href="{{ url_for('static', filename='bsolutions.png') }}" type="image/png">
    <style>
        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
            color: #fff;
            overflow-y: auto;
        }
    
        .form-container {
            background-color: #111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
            width: 350px;
            text-align: center;
        }
    
        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #fff;
        }
    
        .form-group {
            margin-bottom: 20px;
        }
    
        .form-group textarea {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            outline: none;
            resize: vertical;
        }
    
        .form-group textarea::placeholder {
            color: #aaa;
        }
    
        .form-group input[type="submit"] {
            background-color: grey;
            color: white;
            cursor: pointer;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
        }
    
        .form-group input[type="submit"]:hover {
            background-color: #fff;
            color: #000;
        }
    
        .prediction-result {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #fff;
        }
    
        .error-message {
            color: red;
            font-size: 1rem;
        }
    
        @media (max-width: 1280px) {
            .form-container {
                width: 300px;
            }
        }
    
        @media (max-width: 768px) {
            .form-container {
                width: 250px;
            }
        }
    </style>
    
</head>
<body>

<div class="form-container">
    <h1>Sentiment Analysis</h1>

    <!-- Form for sentiment analysis -->
    <form method="POST">
        <div class="form-group">
            <textarea name="text_input" rows="4" cols="50" required placeholder="Enter text for sentiment analysis...">{{ text_input }}</textarea>
        </div>
        <div class="form-group">
            <input type="submit" value="Analyze Sentiment">
        </div>
    </form>
    
    {% if sentiment_result is not none %}
        <div class="prediction-result">
            <h3>Prediction: {{ sentiment_result }}</h3>
        </div>
    {% endif %}
    

</body>
</html>
