<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Campaign Prediction</title>
    <link rel="icon" href="{{ url_for('static', filename='bsolutions.png') }}" type="image/png">
    <style>
        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
            color: #fff;
            overflow-y: auto;
        }

        .form-container {
            background-color: #111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
            width: 350px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            outline: none;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input[type="submit"] {
            background-color: grey;
            color: white;
            cursor: pointer;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
        }

        .form-group input[type="submit"]:hover {
            background-color: #fff;
            color: #000;
        }

        .prediction-result {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #fff;
        }

        @media (max-width: 1280px) {
            .form-container {
                width: 300px;
            }
        }

        @media (max-width: 768px) {
            .form-container {
                width: 250px;
            }
        }
    </style>
</head>
<body>

<div class="form-container">
  <h1>Marketing Campaign Prediction</h1>

<form method="POST">
    <div class="form-group">
        <label for="total_accepted">Total Accepted Campaigns (0, 1, 2, 3)</label>
        <input type="number" name="total_accepted" placeholder="Total Accepted Campaigns" min="0" max="5" value="{{ total_accepted }}" required>
    </div>

    <div class="form-group">
        <label for="total_spent">Total Spent (0–3000)</label>
        <input type="number" step="0.01" name="total_spent" placeholder="Total Spent on Products" min="0" max="3000" value="{{ total_spent }}" required>
    </div>

    <div class="form-group">
        <label for="num_catalog_purchases">Number of Catalog Purchases (0–30)</label>
        <input type="number" name="num_catalog_purchases" placeholder="Catalog Purchases" min="0" max="30" value="{{ num_catalog_purchases }}" required>
    </div>

    <div class="form-group">
        <input type="submit" value="Predict Response">
    </div>
</form>

{% if prediction is not none %}
    <div class="prediction-result">
        <h3>Prediction Effectiveness: {{ prediction }}</h3>
    </div>
{% endif %}

</div>

</body>
</html>
