<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance Prediction</title>
    <link rel="icon" href="{{ url_for('static', filename='bsolutions.png') }}" type="image/png">
    <style>
        body {
            background-color: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            margin: 0;
            color: #fff;
            overflow-y: auto;
        }

        .form-container {
            background-color: #111;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            outline: none;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input[type="submit"] {
            background-color: grey;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .form-group input[type="submit"]:hover {
            background-color: #fff;
            color: #000;
        }

        .prediction-result {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #fff;
        }

        .error-message {
            color: red;
            font-size: 1rem;
        }

        @media (max-width: 1280px) {
            .form-container {
                width: 300px;
            }
        }

        @media (max-width: 768px) {
            .form-container {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Employee Performance Prediction</h2><br>
<form method="POST" action="/employee_performance">

    <!-- EmpEnvironmentSatisfaction -->
    <div class="form-group">
        <label for="empenvironment">Environment Satisfaction (0-4)</label>
        <input type="number" name="empenvironment" placeholder="Environment Satisfaction" min="0" max="4" value="{{ empenvironment }}" required>
    </div>

    <!-- EmpLastSalaryHikePercent -->
    <div class="form-group">
        <label for="emplastsalary">Last Salary Hike (%12 , 14 , 21 , 28)</label>
        <input type="number" name="emplastsalary" placeholder="Last Salary Hike Percent" min="0" max="100" value="{{ emplastsalary }}" required>
    </div>

    <!-- EmpWorkLifeBalance -->
    <div class="form-group">
        <label for="empworklife">Work Life Balance (0-4)</label>
        <input type="number" name="empworklife" placeholder="Work Life Balance" min="0" max="4" value="{{ empworklife }}" required>
    </div>

    <!-- ExperienceYearsAtThisCompany -->
    <div class="form-group">
        <label for="experience">Experience (Years 1-30) At This Company</label>
        <input type="number" name="experience" placeholder="Experience Years at Company" min="0" max="40" value="{{ experience }}" required>
    </div>

    <!-- ExperienceYearsInCurrentRole -->
    <div class="form-group">
        <label for="currentrole">Experience (Years 1-30) In Current Role</label>
        <input type="number" name="currentrole" placeholder="Experience Years in Current Role" min="0" max="40" value="{{ currentrole }}" required>
    </div>

    <!-- YearsSinceLastPromotion -->
    <div class="form-group">
        <label for="lastpromotion">Years (1-30) Since Last Promotion</label>
        <input type="number" name="lastpromotion" placeholder="Years Since Last Promotion" min="0" max="40" value="{{ lastpromotion }}" required>
    </div>

    <!-- YearsWithCurrManager -->
    <div class="form-group">
        <label for="currmanager">Years (1-30) With Current Manager</label>
        <input type="number" name="currmanager" placeholder="Years With Current Manager" min="0" max="40" value="{{ currmanager }}" required>
    </div>

    <div class="form-group">
        <input type="submit" value="Predict">
    </div>
</form>

{% if performance_prediction is not none %}
    <div class="prediction-result">
        <h3>Performance Score: {{ performance_prediction }}</h3>
    </div>
{% endif %}


        
        
</body>
</html>
