<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance Prediction</title>
    <style>
        body {
            background-image: url('/static/background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        
        .form-container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: grey;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .form-group input[type="submit"] {
            background-color: lightgreen;
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            margin-top: 20px;
        }

        .form-group input[type="submit"]:hover {
            background-color: darkgreen;
        }

        .prediction-result {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #333;
        }

        .error-message {
            color: red;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Employee Performance Prediction</h2>
        <form method="POST">
            <div class="form-group">
                <label for="job_involvement">Job Involvement (1 to 4):</label>
                <input type="number" name="job_involvement" min="1" max="4" step="1" required>
            </div>

            <div class="form-group">
                <label for="performance_rating">Performance Rating (1 to 5):</label>
                <input type="number" name="performance_rating" min="1" max="5" step="1" required>
            </div>

            <div class="form-group">
                <label for="work_life_balance">Work-Life Balance (1 to 4):</label>
                <input type="number" name="work_life_balance" min="1" max="4" step="1" required>
            </div>

            <div class="form-group">
                <label for="job_level">Job Level (1 to 5):</label>
                <input type="number" name="job_level" min="1" max="5" step="1" required>
            </div>

            <div class="form-group">
                <label for="monthly_income">Monthly Income (e.g., 1000 to 30000):</label>
                <input type="number" name="monthly_income" min="1000" max="30000" step="100" required>
            </div>

            <div class="form-group">
                <input type="submit" value="Predict">
            </div>
        </form>
        {% if prediction is not none %}
            <div class="prediction-result">
                <h3>Predicted Performance Score: {{ prediction }}</h3>
            </div>
        {% endif %}
    </div>
</body>
</html>
