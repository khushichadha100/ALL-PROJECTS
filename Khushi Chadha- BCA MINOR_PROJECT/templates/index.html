<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Solutions</title>

    <!-- Embedded CSS -->
    <style>
        body {
            background-image: url('/static//background.jpg');
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
        }
        .navbar {
            background-color: #333;
        }
        .navbar a {
            color: white;
            padding: 14px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            max-width: 1200px;
             
            text-align: center;
            padding: 10px;
        }
        .container h1 {
            font-size: 3rem;
            color: #555555;
            font-weight: bold;
        }
        .content-box {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px; /* Space between the image and text */
        }
        .content-box img {
            width: 45%;
            max-width: 400px;
            border-radius: 10px;
        }
        .content-box .text-content {
            width: 45%;
            text-align: left;
            padding: 20px;
        }
        .content-box .text-content h2 {
            font-size: 2rem;
            color: #222222;
        }
        .content-box .text-content p {
            font-size: 1rem;
            color: #555555;
        }
        .content-box-reverse {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row-reverse; /* Reverse the direction */
            gap: 40px; /* Space between the image and text */
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('about') }}">About</a>
    <a href="{{ url_for('services') }}">Services</a>
    <a href="{{ url_for('login') }}">Login</a>
</nav>

<!-- Main Content -->
<div class="container">
    <h1>Welcome to Corporate Solutions private limited</h1>
  
      <div class="content-box">
        <img src="{{ url_for('static', filename='index-onestopsolution.png') }}"style="width: 300px; height: 300px;">
        
    <div class="text-content">
   <h2>Together, we aim to create sustainable success and unlock new opportunities for your organization.</h2>
     </div>
    </div>

</body>
</html>
