<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peer Sentiment Analysis</title>
    
    <style>
        body {
            background-image: url('/static/background.jpg'); /* Background image */
            background-size: cover;
            background-position: center;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .form-container {
            background-color: rgba(255, 255, 255, 0.7); /* Semi-transparent white */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        
        h1 {
            color: grey; /* Grey color for heading */
            font-size: 2rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }

        .form-group textarea {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }

        .form-group input[type="submit"] {
            background-color: lightgreen; /* Green button color */
            color: white;
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
        }

        .form-group input[type="submit"]:hover {
            background-color: darkgreen; /* Darker green when hovered */
        }

        .prediction-result {
            margin-top: 20px;
            font-size: 1.5rem;
            color: black; /* Black color for prediction result */
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>Peer Sentiment Analysis</h1>
    
    <!-- Form for sentiment analysis -->
     <form method="POST">
    <div class="form-group">
        <textarea name="text_input" rows="4" cols="50" required placeholder="Enter text for sentiment analysis..."></textarea>
    </div>
    <div class="form-group">
        <input type="submit" value="Analyze Sentiment">
    </div>
</form>

    {% if sentiment_result is not none %}
        <div class="prediction-result">
            <h3>Prediction: {{ sentiment_result }}</h3>
        </div>
    {% endif %}
</div>

</body>
</html>
